<html>
    <head>
        <title> Employee List</title>
    </head>

    <body>

        <h1> Add Employee</h1>
        <form id="employeeForm" onsubmit="return false;">
            
            <input type="hidden" id="employeeId" name="employeeId">

            <label for="employeeName">Employee Name:</label>
            <input type="text" id="employeeName" name="employeeName" required><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br><br>

            <label for="salary">Salary:</label>
            <input type="number" id="salary" name="salary" required><br><br>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select a department</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="Finance">Finance</option>
            </select><br><br>

            <label for="permanent">Permanent:</label>
            <input type="checkbox" id="permanent" name="permanent"><br><br>

            <button type="submit" id="saveButton" onclick="saveEmployee()">Add Employee</button>
        <h1>Employee List</h1>
        <button onclick="loadEmployees()">
            Load Employees
        </button>
        <table border="1">
            <thead>
                <tr>
                    <th>Employee  ID</th>
                    <th>Employee Name</th>
                    <th>Age</th>
                    <th>Salary</th>
                    <th>Department</th>
                    <th>Permanent</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">

            </tbody>
        </table>
        <script src="app.js"></script>
    </body>
